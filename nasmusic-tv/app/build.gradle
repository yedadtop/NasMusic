plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nasmusic.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nasmusic.tv'
        minSdk 26
        targetSdk 28
        versionCode 3
        versionName '2.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // targetSdk 故意留在 28：这台电视就是 Android 9（SDK 28），
    // 侧载自用不上架 Play，没必要为了过 lint 抬到 33+ 引入新的行为变更。
    lint {
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    // 只需要 RecyclerView 做网格/列表；其余全部用 framework API，
    // 在 Android 9 老电视上体积小、启动快、依赖冲突为零。
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // 设置页二维码：只引 core（纯 Java 编码器，不含相机/扫码），约 500KB
    implementation 'com.google.zxing:core:3.5.3'
}
